name: Update RS Ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: mkdir -p docs

      - name: Generate RS ratings (stock-level and industry-group)
        run: >
          python rs_ratings.py
          --csv docs/rs_ratingsKR.csv
          --json docs/rs_ratingsKR.json
          --industry-csv docs/rs_industry_KR.csv
          --industry-json docs/rs_industry_KR.json

      - run: python generate_site.py

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add docs

          git diff --cached --quiet || \
          git commit -m "Daily RS update"

          git push